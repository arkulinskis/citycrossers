<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 80 80" width="80" height="80">
  <!-- A walker loops the route and takes a break at every snack stop. -->
  <path id="loop" d="M40 14 a26 26 0 1 1 0 52 a26 26 0 1 1 0 -52" fill="none" stroke="#9FE3C2" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="0.01 7"/>
  <circle cx="40" cy="14" r="4.5" fill="#FF7A3D" stroke="#fff" stroke-width="2"/>
  <circle cx="62.5" cy="53" r="4.5" fill="#FFC83D" stroke="#fff" stroke-width="2"/>
  <circle cx="17.5" cy="53" r="4.5" fill="#FF7A3D" stroke="#fff" stroke-width="2"/>
  <circle r="6.5" fill="#17A673" stroke="#fff" stroke-width="2.5">
    <animateMotion dur="2.4s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;0.3333;0.3333;0.6667;0.6667;1" keyTimes="0;0.14;0.33;0.47;0.66;0.8;1">
      <mpath href="#loop" xlink:href="#loop"/>
    </animateMotion>
  </circle>
</svg>
