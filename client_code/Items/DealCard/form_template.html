<div class="deal-cell">
  <div class="cc-card cc-deal-card" anvil:dom-node="card" anvil:on-dom:click="self.card_click" anvil:on-dom:keydown="self.card_key">
    <div class="cc-row between"><span class="cc-deal-tag" anvil:dom-node="tag"></span><span class="small" anvil:dom-node="place"></span></div>
    <h3 class="cc-deal-h" anvil:dom-node="title"></h3>
    <div class="small" anvil:dom-node="desc"></div>
    <div class="small cc-deal-code" anvil:dom-node="code_row">Code: <span class="cc-code" anvil:dom-node="code"></span></div>
    <div class="small muted" anvil:dom-node="until"></div>
  </div>
</div>
