<div class="cc-trow ad-deal">
  <div><b anvil:dom-node="title"></b><div class="small muted" anvil:dom-node="desc"></div></div>
  <div anvil:dom-node="place"></div>
  <div anvil:dom-node="pct"></div>
  <div><span class="cc-code" anvil:dom-node="code"></span><span anvil:dom-node="nocode">—</span></div>
  <div anvil:dom-node="until"></div>
  <div><span class="cc-pill" anvil:dom-node="status"></span></div>
  <div class="cc-row cc-tacts">
    <anvil-component type="Button" name="edit_button" prop:text="Edit" prop:role='["cc-btn", "ghost", "sm"]'></anvil-component>
    <anvil-component type="Button" name="toggle_button" prop:role='["cc-btn", "soft", "sm"]'></anvil-component>
    <anvil-component type="Button" name="delete_button" prop:text="✕" prop:role='["cc-btn", "danger", "sm"]'></anvil-component>
  </div>
</div>
