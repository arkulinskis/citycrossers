<div class="cc-trow ad-place">
  <div><b anvil:dom-node="name"></b><div class="small muted" anvil:dom-node="desc"></div></div>
  <div anvil:dom-node="kind"></div>
  <div anvil:dom-node="rating"></div>
  <div anvil:dom-node="deal"></div>
  <div class="cc-row cc-tacts">
    <anvil-component type="Button" name="verify_button" prop:role='["cc-btn", "ghost", "sm"]'></anvil-component>
    <anvil-component type="Button" name="deal_button" prop:text="+ Deal" prop:role='["cc-btn", "ghost", "sm"]'></anvil-component>
    <anvil-component type="Button" name="delete_button" prop:text="✕" prop:role='["cc-btn", "danger", "sm"]'></anvil-component>
  </div>
</div>
