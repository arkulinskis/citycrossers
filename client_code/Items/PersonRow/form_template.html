<div class="cc-person-row" anvil:dom-node="row">
  <div class="cc-row between cc-pr-line">
    <anvil-component type="CityCrossers.Components.Person" name="person"></anvil-component>
    <div class="cc-row cc-pr-acts" anvil:dom-node="side">
      <anvil-component type="Button" name="b1" prop:role='["cc-btn", "sm"]'></anvil-component>
    </div>
  </div>
  <div class="small cc-pr-note" anvil:dom-node="note"></div>
  <div class="cc-row cc-pr-under" anvil:dom-node="under">
    <anvil-component type="Button" name="b2" prop:role='["cc-btn", "sm"]'></anvil-component>
    <anvil-component type="Button" name="b3" prop:role='["cc-btn", "ghost", "sm"]'></anvil-component>
    <a class="cc-btn ghost sm" anvil:name="profile_link">Profile</a>
  </div>
</div>
