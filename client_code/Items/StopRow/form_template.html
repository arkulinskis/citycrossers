<div class="cc-stop-row">
  <span class="n" anvil:dom-node="n"></span><span class="e" anvil:dom-node="e" aria-hidden="true"></span>
  <div class="t"><b anvil:dom-node="name"></b><span anvil:dom-node="sub"></span></div>
  <div class="ctl">
    <button type="button" anvil:dom-node="edit" anvil:on-dom:click="self.edit_click" title="Edit">✏️</button>
    <button type="button" anvil:dom-node="up" anvil:on-dom:click="self.up_click" title="Move up">↑</button>
    <button type="button" anvil:dom-node="down" anvil:on-dom:click="self.down_click" title="Move down">↓</button>
    <button type="button" anvil:dom-node="del" anvil:on-dom:click="self.del_click" title="Remove">✕</button>
  </div>
</div>
