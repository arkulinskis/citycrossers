<div class="cc-stop-row">
  <span class="e" anvil:dom-node="e" aria-hidden="true"></span>
  <div class="t"><b anvil:dom-node="name"></b><span anvil:dom-node="sub"></span></div>
  <div class="cc-row cc-nowrap-row">
    <anvil-component type="Button" name="vote_button" prop:role='["cc-btn", "sm"]'></anvil-component>
    <span class="cc-pill" anvil:dom-node="votes"></span>
    <anvil-component type="Button" name="accept_button" prop:text="✓ Add" prop:role='["cc-btn", "soft", "sm"]'></anvil-component>
    <anvil-component type="Button" name="remove_button" prop:text="✕" prop:tooltip="Remove" prop:role='["cc-btn", "ghost", "sm"]'></anvil-component>
  </div>
</div>
