<div class="cc-j-item" anvil:dom-node="item">
  <span class="marker" anvil:dom-node="marker" aria-hidden="true"></span>
  <div class="cc-card" anvil:dom-node="card">
    <div class="cc-row between"><span class="date"><span anvil:dom-node="date"></span><a anvil:dom-node="walk_link"></a></span><span class="cc-pill" anvil:dom-node="vis"></span></div>
    <div class="cc-row between cc-j-head" anvil:dom-node="head"><h3 class="cc-j-title" anvil:dom-node="title"></h3><a class="cc-j-title" anvil:dom-node="title_link"></a><span class="cc-rating" anvil:dom-node="stars"></span></div>
    <b anvil:dom-node="rtitle"></b>
    <p class="cc-j-body" anvil:dom-node="body"></p>
    <div class="cc-future" anvil:dom-node="future"></div>
    <div class="small muted cc-mt-xs" anvil:dom-node="back">💚 Would go back</div>
    <img class="cc-j-photo" alt="" anvil:dom-node="photo">
    <div class="small" anvil:dom-node="walk_sum"></div>
    <div class="cc-row end cc-mt-sm" anvil:name="acts">
      <anvil-component type="Button" name="toggle_button" prop:role='["cc-btn", "ghost", "sm"]'></anvil-component>
      <anvil-component type="Button" name="edit_button" prop:text="Edit" prop:role='["cc-btn", "ghost", "sm"]'></anvil-component>
      <anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role='["cc-btn", "danger", "sm"]'></anvil-component>
    </div>
  </div>
</div>
