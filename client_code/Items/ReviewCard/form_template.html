<div class="cc-review">
  <div anvil:name="person_part"><anvil-component type="CityCrossers.Components.Person" name="person"></anvil-component></div>
  <div class="cc-row between cc-review-head" anvil:dom-node="head">
    <b anvil:dom-node="place"></b>
    <span class="cc-rating" anvil:dom-node="stars"></span>
  </div>
  <div class="cc-review-title" anvil:dom-node="title"></div>
  <div class="small" anvil:dom-node="body"></div>
  <div class="cc-future small" anvil:dom-node="future"></div>
  <div class="small muted" anvil:dom-node="back">💚 Would go back</div>
</div>
