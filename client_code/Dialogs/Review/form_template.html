<div class="cc-dlg">
  <anvil-component type="Label" name="title" prop:role='["cc-modal-title"]'></anvil-component>
  <p class="cc-modal-sub">Reviews live in your Journey. Keep them private as notes for future you, or share your taste with the world.</p>
  <div class="cc-field"><anvil-component type="CityCrossers.Components.Stars" name="stars"></anvil-component></div>
  <label class="cc-field"><span class="cc-label">Headline</span>
    <anvil-component type="TextBox" name="title_box" prop:placeholder="Sum it up in a few words"></anvil-component>
  </label>
  <label class="cc-field"><span class="cc-label">Your review</span>
    <anvil-component type="TextArea" name="body_box" prop:placeholder="What was it like? What should people order?" prop:height="100"></anvil-component>
  </label>
  <label class="cc-field"><span class="cc-label">💌 Note to future me</span>
    <anvil-component type="TextArea" name="future_box" prop:placeholder="Dear future me... (only you can see this)" prop:height="70"></anvil-component>
    <span class="hint">e.g. “Order the cardamom bun, skip the latte. Sit upstairs.”</span>
  </label>
  <anvil-component type="CheckBox" name="again_box" prop:text="I'd come back here" prop:checked="true"></anvil-component>
  <anvil-component type="CheckBox" name="public_box" prop:text="🌍 Make this review public (+4 pts). Your note to future you stays private."></anvil-component>
  <div class="cc-row end dlg-acts">
    <anvil-component type="Button" name="no_button" prop:text="Cancel" prop:role='["cc-btn", "ghost"]'></anvil-component>
    <anvil-component type="Button" name="yes_button" prop:text="Save review" prop:role='["cc-btn", "orange"]'></anvil-component>
  </div>
</div>
