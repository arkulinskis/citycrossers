<div class="cc-dlg">
  <h2 class="cc-modal-title">Which place?</h2>
  <p class="cc-modal-sub">Any spot on the CityCrossers map. Not there? Add it from the Map page first.</p>
  <label class="cc-field"><span class="cc-label">Place</span>
    <anvil-component type="DropDown" name="place_dd" prop:include_placeholder="true" prop:placeholder="Choose a place…"></anvil-component>
  </label>
  <div class="cc-row end dlg-acts">
    <anvil-component type="Button" name="no_button" prop:text="Cancel" prop:role='["cc-btn", "ghost"]'></anvil-component>
    <anvil-component type="Button" name="yes_button" prop:text="Next" prop:role='["cc-btn"]'></anvil-component>
  </div>
</div>
