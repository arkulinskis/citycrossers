<div class="cc-dlg">
  <h2 class="cc-modal-title">🛟 The CityCrossers safety pledge</h2>
  <p class="cc-modal-sub">Before your first walk with new people, a few promises. Takes 20 seconds, counts forever.</p>
  <label class="cc-card flat cc-pledge-row"><input type="checkbox" anvil:dom-node="c1"><span><b>📍 I'll meet in public places</b><span class="small muted">Meeting points are busy, well-lit public spots. Never someone's home.</span></span></label>
  <label class="cc-card flat cc-pledge-row"><input type="checkbox" anvil:dom-node="c2"><span><b>📲 I'll tell someone my plans</b><span class="small muted">Share the walk link with a friend or family member before you go.</span></span></label>
  <label class="cc-card flat cc-pledge-row"><input type="checkbox" anvil:dom-node="c3"><span><b>👀 I'll trust my gut</b><span class="small muted">If something feels off, I can leave at any time, no explanation needed.</span></span></label>
  <label class="cc-card flat cc-pledge-row"><input type="checkbox" anvil:dom-node="c4"><span><b>🤝 I'll be a good walker</b><span class="small muted">Respect, consent and kindness. Zero tolerance for harassment.</span></span></label>
  <label class="cc-card flat cc-pledge-row"><input type="checkbox" anvil:dom-node="c5"><span><b>💧 I'll look after myself</b><span class="small muted">Water, snacks, comfy shoes, a charged phone. Know your limits.</span></span></label>
  <label class="cc-card flat cc-pledge-row"><input type="checkbox" anvil:dom-node="c6"><span><b>🚩 I'll report problems</b><span class="small muted">Reports go straight to our team and are kept confidential.</span></span></label>
  <div class="cc-row end dlg-acts">
    <anvil-component type="Button" name="no_button" prop:text="Not now" prop:role='["cc-btn", "ghost"]'></anvil-component>
    <anvil-component type="Button" name="yes_button" prop:text="I promise 🤝" prop:role='["cc-btn"]'></anvil-component>
  </div>
</div>
